version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./artifacts:/app/artifacts:ro
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    env_file: .env
    volumes:
      - ./artifacts:/app/artifacts:ro
    depends_on:
      - redis
    restart: unless-stopped
    deploy:
      replicas: 2
